name: Build LibV2Ray AAR Full Core (WS + TLS Support)

on:
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android NDK
      uses: ndk-actions/setup-ndk@v2
      with:
        ndk-version: r25c

    - name: Install Gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: Clone Source Code v2rayNG Lib
      run: |
        git clone https://github.com/2dust/v2rayNG.git

    - name: Compile Go Core + Tun2Socks -> libv2ray.aar
      run: |
        cd v2rayNG/v2rayN/libs
        gomobile bind -v -target=android/arm64,android/arm -androidapi 21 -javapkg=libv2ray -o ../../../libv2ray.aar .

    - name: Create GitHub Release & Upload AAR
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0
        name: "LibV2Ray Core Native AAR v1.0.0"
        draft: false
        prerelease: false
        files: libv2ray.aar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
