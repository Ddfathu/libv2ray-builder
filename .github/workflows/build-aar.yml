name: Build LibV2Ray AAR Full Core

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go 1.21 (Compatible with libXray Anet)
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set Valid NDK Path
      run: |
        NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -n 1)
        echo "Menggunakan NDK dari: $NDK_PATH"
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

    - name: Install Gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init

    - name: Clone libXray Go Source
      run: |
        git clone https://github.com/XTLS/libXray.git libsource

    - name: Compile Go Core -> libv2ray.aar
      run: |
        cd libsource
        go mod tidy
        gomobile bind -v -target=android/arm64,android/arm -androidapi 21 -javapkg=libv2ray -o $GITHUB_WORKSPACE/libv2ray.aar .

    - name: Create GitHub Release & Upload AAR
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "LibV2Ray Core Native AAR v1.0.0"
        draft: false
        prerelease: false
        files: libv2ray.aar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
