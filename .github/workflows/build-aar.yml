name: Build LibV2Ray AAR Full Core

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go 1.21
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set Stable NDK Path (r25)
      run: |
        # Pakai NDK r25b/r25c bawaan runner
        NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/25* 2>/dev/null | tail -n 1)
        if [ -z "$NDK_PATH" ]; then
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | head -n 1)
        fi
        echo "Menggunakan NDK dari: $NDK_PATH"
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

    - name: Clone libXray Go Source
      run: |
        git clone https://github.com/XTLS/libXray.git libsource

    - name: Install Compatible Gomobile & Build AAR
      run: |
        cd libsource
        
        # Install gomobile versi stabil untuk Go 1.21
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20231127183840-761c98768f36
        go install golang.org/x/mobile/cmd/gobind@v0.0.0-20231127183840-761c98768f36
        gomobile init

        # Patch dependency agar tidak error net.zoneCache
        go mod edit -replace github.com/wlynxg/anet=github.com/wlynxg/anet@v0.0.5
        go mod tidy

        # Build AAR
        CGO_ENABLED=1 gomobile bind -v -target=android/arm64,android/arm -androidapi 21 -javapkg=libv2ray -o $GITHUB_WORKSPACE/libv2ray.aar .

    - name: Create GitHub Release & Upload AAR
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "LibV2Ray Core Native AAR v1.0.0"
        draft: false
        prerelease: false
        files: libv2ray.aar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
