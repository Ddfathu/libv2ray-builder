name: Build LibV2Ray AAR Full Core

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set Android NDK Environment Variable
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk-bundle" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk-bundle" >> $GITHUB_ENV

    - name: Install Gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20231127183840-761c98768f36
        go install golang.org/x/mobile/cmd/gobind@v0.0.0-20231127183840-761c98768f36
        gomobile init

    - name: Clone Source Go LibV2Ray
      run: |
        git clone https://github.com/2dust/v2rayNG.git temp_repo
        # Ambil folder libv2ray / libXray yang berisi go.mod asli
        if [ -d "temp_repo/v2rayN/libs" ]; then
          cp -r temp_repo/v2rayN/libs ./libsource
        elif [ -d "temp_repo/LibV2ray" ]; then
          cp -r temp_repo/LibV2ray ./libsource
        else
          git clone https://github.com/XTLS/libXray.git libsource
        fi

    - name: Compile Go Core -> libv2ray.aar
      run: |
        cd libsource
        go mod tidy
        gomobile bind -v -target=android/arm64,android/arm -androidapi 21 -javapkg=libv2ray -o $GITHUB_WORKSPACE/libv2ray.aar .

    - name: Create GitHub Release & Upload AAR
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "LibV2Ray Core Native AAR v1.0.0"
        draft: false
        prerelease: false
        files: libv2ray.aar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
