name: Build LibV2Ray AAR Official

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.22'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set Valid NDK Path
      run: |
        NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -n 1)
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

    - name: Clone libXray Go Source
      run: |
        git clone https://github.com/XTLS/libXray.git libsource

    - name: Build AAR using libXray Official Build Script
      run: |
        cd libsource
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init

        python3 build/main.py android --no-snapshot

        find . -name "*.aar" -exec cp {} $GITHUB_WORKSPACE/libv2ray.aar \;

    - name: Create GitHub Release & Upload AAR
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "LibV2Ray Core Native AAR v1.0.0"
        draft: false
        prerelease: false
        files: libv2ray.aar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
